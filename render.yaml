services:
  - type: web
    name: leamss-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DB_NAME
        value: leamss
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://leamss.com,https://www.leamss.com,https://portal.leamss.com
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: APP_ROOT
        value: /app
      # Set to 0 after adding "python -m migrations.run_all" as a pre-deploy command
      - key: RUN_STARTUP_MIGRATIONS
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
