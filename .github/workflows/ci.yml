name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, unit, security, audit)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: leamss_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      INITIAL_ADMIN_PASSWORD: Ci!AdminPassw0rd
      SEED_DEMO_PASSWORD: Ci!DemoPassw0rd
      LEAMSS_DISABLE_SCHEDULER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system libraries (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (bug-level rules)
        run: ruff check .
      - name: Unit tests
        run: pytest -q tests/unit tests/test_iteration149_occupation_open.py
      - name: Start API
        run: |
          nohup uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8001/api/health && break; sleep 3; done
          curl -fsS http://127.0.0.1:8001/api/health
      - name: Security regression tests
        env:
          API_BASE_URL: http://127.0.0.1:8001
          TEST_ADMIN_PASSWORD: Ci!AdminPassw0rd
        run: pytest -q tests/test_security_hardening.py tests/test_governance_api.py
      - name: Dependency vulnerability audit
        continue-on-error: true   # report new advisories without blocking merges
        run: pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: API log (on failure)
        if: failure()
        run: tail -n 200 /tmp/api.log || true

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
          REACT_APP_BACKEND_URL: https://api.leamss.com
        run: npm run build
